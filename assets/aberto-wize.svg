<svg xmlns="http://www.w3.org/2000/svg" width="280" height="168" viewBox="0 0 280 168" role="img" aria-label="Wize Development Kit: 10 agentes do brief ao código testado, com pentest por IA">
<title>Wize Development Kit: 10 agentes do brief ao código testado, com pentest por IA</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}

.t{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.s{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A39A8A}
.p{font:700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.2px;fill:#D6BD8F}
.l{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFC6B6}
.i{font:18px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2CDA4"/><stop offset="1" stop-color="#8C7148"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#F1E3C4" stop-opacity="0"/><stop offset=".5" stop-color="#F1E3C4" stop-opacity=".09"/><stop offset="1" stop-color="#F1E3C4" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="278" height="166" rx="14" fill="#151310" stroke="#2A2723"/>
<clipPath id="c"><rect x="1" y="1" width="278" height="166" rx="14"/></clipPath>
<g clip-path="url(#c)"><g class="shine"><rect x="0" y="-20" width="150" height="208" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="278" height="166" rx="14" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<rect x="18" y="18" width="34" height="34" rx="9" fill="#1F1C18" stroke="#2A2723"/>
<text class="i" x="35" y="41" text-anchor="middle">🧙</text>
<rect x="209.5" y="24" width="52.5" height="20" rx="10" fill="#1F1C18" stroke="#3A352E"/>
<text class="p" x="235.8" y="37.5" text-anchor="middle">QWIZE</text>
<g class="up" style="animation-delay:0.00s"><text class="t" x="18" y="82">Wize Development Kit</text>
<text class="s" x="18" y="100">qwize-br</text></g>
<g class="up" style="animation-delay:0.20s"><text class="l" x="18" y="128">10 agentes do brief ao código</text><text class="l" x="18" y="146">testado, com pentest por IA</text></g>
</svg>
