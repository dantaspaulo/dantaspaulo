<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" role="img" aria-label="1 mi+ peças, −95% de custo de nuvem, 8 clientes como FDE em um mês, 20+ anos de software">
<title>1 mi+ peças, −95% de custo de nuvem, 8 clientes como FDE em um mês, 20+ anos de software</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}

.n{font:400 48px Georgia,'Times New Roman',serif;fill:url(#g)}
.l{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFC6B6}
.v{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2CDA4"/><stop offset="1" stop-color="#8C7148"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#F1E3C4" stop-opacity="0"/><stop offset=".5" stop-color="#F1E3C4" stop-opacity=".09"/><stop offset="1" stop-color="#F1E3C4" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="154" rx="18" fill="#151310" stroke="#2A2723"/>
<clipPath id="c"><rect x="1" y="1" width="838" height="154" rx="18"/></clipPath>
<g clip-path="url(#c)"><g class="shine"><rect x="0" y="-20" width="150" height="196" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="838" height="154" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<g class="up" style="animation-delay:0.15s"><text class="n" x="105" y="74" text-anchor="middle">1 mi+</text></g>
<g class="up" style="animation-delay:0.35s"><text class="l" x="105" y="104" text-anchor="middle">peças jurídicas</text><text class="l" x="105" y="123" text-anchor="middle">geradas no ChatADV</text></g>
<g class="up" style="animation-delay:0.33s"><text class="n" x="315" y="74" text-anchor="middle">−95%</text></g>
<g class="up" style="animation-delay:0.53s"><text class="l" x="315" y="104" text-anchor="middle">custo de nuvem do ChatADV,</text><text class="l" x="315" y="123" text-anchor="middle">migração em uma semana</text></g>
<line class="v" x1="210" y1="34" x2="210" y2="122" stroke="#2A2723" pathLength="100" style="animation-delay:0.33s"/>
<g class="up" style="animation-delay:0.51s"><text class="n" x="525" y="74" text-anchor="middle">8</text></g>
<g class="up" style="animation-delay:0.71s"><text class="l" x="525" y="104" text-anchor="middle">clientes liderados</text><text class="l" x="525" y="123" text-anchor="middle">como FDE em um mês</text></g>
<line class="v" x1="420" y1="34" x2="420" y2="122" stroke="#2A2723" pathLength="100" style="animation-delay:0.51s"/>
<g class="up" style="animation-delay:0.69s"><text class="n" x="735" y="74" text-anchor="middle">20+</text></g>
<g class="up" style="animation-delay:0.89s"><text class="l" x="735" y="104" text-anchor="middle">anos de software,</text><text class="l" x="735" y="123" text-anchor="middle">10 de advocacia</text></g>
<line class="v" x1="630" y1="34" x2="630" y2="122" stroke="#2A2723" pathLength="100" style="animation-delay:0.69s"/>
</svg>
