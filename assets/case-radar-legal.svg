<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="Radar Legal: 707/707 leituras auditadas com o trecho literal conferido na decisão">
<title>Radar Legal: 707/707 leituras auditadas com o trecho literal conferido na decisão</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}

.t{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.s{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A39A8A}
.p{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.3px;fill:#D6BD8F}
.n{font:400 50px Georgia,'Times New Roman',serif;fill:url(#g)}
.l{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFC6B6}
.f{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8F8778}
.i{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2CDA4"/><stop offset="1" stop-color="#8C7148"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#F1E3C4" stop-opacity="0"/><stop offset=".5" stop-color="#F1E3C4" stop-opacity=".09"/><stop offset="1" stop-color="#F1E3C4" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="418" height="234" rx="16" fill="#151310" stroke="#2A2723"/>
<clipPath id="c"><rect x="1" y="1" width="418" height="234" rx="16"/></clipPath>
<g clip-path="url(#c)"><g class="shine"><rect x="0" y="-20" width="150" height="276" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="418" height="234" rx="16" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<rect x="22" y="22" width="40" height="40" rx="11" fill="#1F1C18" stroke="#2A2723"/>
<text class="i" x="42" y="50" text-anchor="middle">📡</text>
<text class="t" x="76" y="40">Radar Legal</text>
<text class="s" x="76" y="59">a posição do juiz, com a prova</text>
<g class="up" style="animation-delay:0.35s"><text class="n" x="22" y="138">707/707</text></g>
<g class="up" style="animation-delay:0.60s"><text class="l" x="24" y="166">leituras auditadas com o trecho</text><text class="l" x="24" y="185">literal conferido na decisão</text></g>
<line class="ln" x1="24" y1="196" x2="396" y2="196" stroke="#2A2723" pathLength="100" style="animation-delay:0.75s"/>
<g class="up" style="animation-delay:0.85s"><text class="f" x="24" y="219">lei, tese ou processo monitorado</text></g>
<rect x="265.0" y="22" width="133.0" height="22" rx="11" fill="#1F1C18" stroke="#3A352E"/>
<text class="p" x="331.5" y="37" text-anchor="middle">PRODUTO PRÓPRIO</text>
</svg>
